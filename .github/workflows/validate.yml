name: Validate schemas
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install lxml
      - name: Compile every XSD and validate committed examples
        run: |
          python - <<'PY'
          import glob, sys
          from lxml import etree
          failures = 0
          schemas = {}
          for p in glob.glob('**/*.xsd', recursive=True):
              try:
                  schemas[p] = etree.XMLSchema(etree.parse(p))
                  print(f'OK   {p}')
              except Exception as e:
                  failures += 1
                  print(f'FAIL {p}: {e}')
          # examples live beside their operation: <op>/examples/** validates
          # against the operation's response/request XSD by filename convention
          for ex in glob.glob('**/examples/**/*.xml', recursive=True):
              import os
              opdir = ex.split('examples')[0]
              kind = 'response' if 'response' in ex else 'request'
              cands = [s for s in schemas if s.startswith(opdir.replace(os.sep, chr(47))) and kind in s]
              if not cands:
                  print(f'SKIP {ex} (no matching schema)')
                  continue
              doc = etree.parse(ex)
              ok = any(schemas[c].validate(doc) for c in cands)
              print(('OK  ' if ok else 'FAIL') + f' {ex}')
              failures += 0 if ok else 1
          sys.exit(1 if failures else 0)
          PY
      - name: Validate JSON schemas and examples
        run: |
          pip install jsonschema referencing
          python - <<'PY'
          import glob, json, os, sys
          from jsonschema import Draft202012Validator
          from referencing import Registry, Resource
          failures = 0
          # every *.json must parse
          for p in glob.glob('**/*.json', recursive=True):
              try:
                  json.load(open(p, encoding='utf-8'))
              except Exception as e:
                  failures += 1; print(f'FAIL parse {p}: {e}')
          # JSON-Schema families: build a registry keyed by $id, validate each example
          reg = Registry()
          for p in glob.glob('**/*.schema.json', recursive=True):
              doc = json.load(open(p, encoding='utf-8'))
              if '$id' in doc:
                  reg = reg.with_resource(doc['$id'], Resource.from_contents(doc))
          for rs in glob.glob('**/*-request.schema.json', recursive=True):
              opdir = os.path.dirname(rs)
              op = os.path.basename(rs).replace('-request.schema.json', '')
              for schema, ex in [
                  (rs, os.path.join(opdir, 'examples', 'request-sample.json')),
                  (os.path.join(opdir, f'{op}-response.schema.json'),
                   os.path.join(opdir, 'examples', 'response-sample.json'))]:
                  if not (os.path.exists(schema) and os.path.exists(ex)):
                      continue
                  doc = json.load(open(schema, encoding='utf-8'))
                  data = json.load(open(ex, encoding='utf-8'))
                  errs = list(Draft202012Validator(doc, registry=reg).iter_errors(data))
                  if errs:
                      failures += 1; print(f'FAIL {ex}: {errs[0].message}')
                  else:
                      print(f'OK   {ex}')
          sys.exit(1 if failures else 0)
          PY
      - name: Forbid internal identifiers (public repo)
        run: |
          # network addresses, internal package/class/source-file names, internal module
          # names, and tenant- or brand-specific identifier names
          ! grep -rn -E '10\.(0|10)\.[0-9]+\.[0-9]+|org\.fio|org\.lms|\bPAL\b|GetOrderServiceV1|\.java\b|CouponServices|CustomerServices|lmsServices|SPERRY|SACY_|KEDS|GRHP|STRI_PERS|GROUP_FIO|[Oo][Ff][Bb]iz' --include='*.xsd' --include='*.md' --include='*.xml' --include='*.json' c360/ customfield/ vrg/ product/ *.md
